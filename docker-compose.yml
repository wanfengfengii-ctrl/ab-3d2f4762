name: pulse-offset-audit

services:
  # 静态站点：纯前端复核台
  web:
    build:
      context: .
      target: web
    image: pulse-offset-audit-web
    ports:
      # 宿主机端口可配置：HOST_PORT=9090 docker compose up web
      - "${HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 一次性复核：代码检查 → 单元裁决 → 构建 → HTTP 冒烟，自行退出并以退出码报告
  verify:
    build:
      context: .
      target: verify
    image: pulse-offset-audit-verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_URL: http://web:80
    restart: "no"
